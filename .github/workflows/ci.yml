name: CI

# Runs the StaticScale test suite on CPU. No models are downloaded (tests use tiny
# synthetic Llama configs and synthetic calibration data). The reference backend is
# correctness-only; no speedup is measured here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install CPU-only PyTorch
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install package (editable) + dev deps
        run: pip install -e ".[dev]"

      - name: Import check
        run: python -c "import staticscale; print('staticscale', staticscale.__version__)"

      - name: Offline sanity (no download)
        run: python eval/run_tiny_sanity.py

      - name: Run tests
        run: python -m pytest tests/ -q
